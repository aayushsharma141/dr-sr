<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>Kalyan Hospital</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-card">
      <div class="brand-mark brand-mark--lg">+</div>
      <p class="muted">Starting Kalyan Hospital…</p>
    </div>
  </div>

  <!-- Public (unauthenticated) surface: sign-in and first-run setup -->
  <div id="auth" class="auth-shell hidden" aria-live="polite"></div>

  <!-- Authenticated application shell -->
  <div id="shell" class="shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand-mark">+</div>
        <div class="sidebar-title">
          <strong id="brand-name">Kalyan Hospital</strong>
          <span id="brand-tagline" class="muted xs">Clinic workspace</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" href="#/dashboard" data-route="dashboard">
          <span class="nav-ico" data-icon="grid"></span><span>Dashboard</span>
        </a>
        <a class="nav-item" href="#/patients" data-route="patients" data-perm="patient.read">
          <span class="nav-ico" data-icon="users"></span><span>Patients</span>
        </a>
        <a class="nav-item" href="#/appointments" data-route="appointments" data-perm="appointment.read">
          <span class="nav-ico" data-icon="calendar"></span><span>Appointments</span>
        </a>
        <a class="nav-item" href="#/billing" data-route="billing" data-perm="billing.read">
          <span class="nav-ico" data-icon="receipt"></span><span>Billing</span>
        </a>

        <div class="nav-group-label" data-perm="user.manage">Administration</div>
        <a class="nav-item" href="#/admin/users" data-route="admin-users" data-perm="user.manage">
          <span class="nav-ico" data-icon="id-card"></span><span>Staff accounts</span>
        </a>
        <a class="nav-item" href="#/admin/audit" data-route="admin-audit" data-perm="audit.read">
          <span class="nav-ico" data-icon="shield"></span><span>Audit trail</span>
        </a>
        <a class="nav-item" href="#/admin/backups" data-route="admin-backups" data-perm="backup.manage">
          <span class="nav-ico" data-icon="database"></span><span>Backups</span>
        </a>
        <a class="nav-item" href="#/admin/settings" data-route="admin-settings" data-perm="settings.manage">
          <span class="nav-ico" data-icon="sliders"></span><span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="net-badge" id="net-badge" title="Patient data stays on this clinic network">
          <span class="dot"></span> Local network only
        </div>
        <a class="nav-item nav-item--sub" href="#/account" data-route="account">
          <span class="nav-ico" data-icon="user"></span><span>My account</span>
        </a>
        <button class="nav-item nav-item--sub" type="button" id="logout-btn">
          <span class="nav-ico" data-icon="logout"></span><span>Sign out</span>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menu-toggle" aria-label="Menu" type="button">
          <span data-icon="menu"></span>
        </button>

        <form class="search" id="global-search" role="search" autocomplete="off">
          <span class="search-ico" data-icon="search"></span>
          <input id="global-search-input" type="search" name="q" placeholder="Search patients by name, MRN or phone…" aria-label="Search patients">
          <kbd class="search-kbd">/</kbd>
          <div class="search-results" id="global-search-results" hidden></div>
        </form>

        <div class="topbar-right">
          <span class="sync-chip" id="sync-chip" title="Connected to the clinic server">
            <span class="dot"></span><span id="sync-label">Connected</span>
          </span>
          <a class="user-chip" href="#/account" title="My account">
            <span class="avatar" id="user-avatar">–</span>
            <span class="user-chip-text">
              <strong id="user-name">–</strong>
              <span class="muted xs" id="user-role">–</span>
            </span>
          </a>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript>
    <div class="noscript">This application needs JavaScript. Ask your administrator for help.</div>
  </noscript>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
