name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase-*", "chore/**", ui/redesign-modern-clinical, ui/clinical-navigation-hierarchy]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libpulse0 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Verify local image assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for asset in (
              Path("app/assets/caduceus_emblem.png"),
              Path("app/assets/kalyan_hospital_logo.jpg"),
              Path("app/assets/physiotherapy_header.jpg"),
          ):
              with Image.open(asset) as image:
                  image.verify()
              print(f"Verified {asset}")
          PY
      - name: Run automated tests
        run: pytest


  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit and integration tests
        working-directory: frontend
        run: npm run test
      - name: Run TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Run Oxlint
        working-directory: frontend
        run: npm run lint
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kalyan_owner
          POSTGRES_PASSWORD: ci_owner_pw
          POSTGRES_DB: kalyan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kalyan_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KALYAN_ENV: test
      KALYAN_DB_HOST: 127.0.0.1
      KALYAN_DB_PORT: "5432"
      KALYAN_DB_NAME: kalyan_test
      KALYAN_TEST_DB_NAME: kalyan_test
      KALYAN_DB_APP_USER: kalyan_app
      KALYAN_DB_APP_PASSWORD: ciapppw1
      KALYAN_DB_OWNER_USER: kalyan_owner
      KALYAN_DB_OWNER_PASSWORD: ci_owner_pw
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend with dev extras
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Create runtime application role
        env:
          PGPASSWORD: ci_owner_pw
        run: >-
          psql -h 127.0.0.1 -U kalyan_owner -d kalyan_test
          -c "CREATE ROLE kalyan_app LOGIN PASSWORD 'ciapppw1'"
      - name: Install PostgreSQL 17 client tools
        # pg_dump must match the server major version (postgres:17 service); the runner's default is 16.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Create throwaway restore database
        # Real backup and restore tests run pg_dump and DROP SCHEMA here, never on kalyan_test.
        env:
          PGPASSWORD: ci_owner_pw
        run: >-
          psql -h 127.0.0.1 -U kalyan_owner -d postgres
          -c "CREATE DATABASE kalyan_restore_test WITH OWNER kalyan_owner TEMPLATE template0 ENCODING 'UTF8' LOCALE_PROVIDER builtin BUILTIN_LOCALE 'C.UTF-8'"
          -c "ALTER DATABASE kalyan_restore_test SET timezone TO 'Asia/Kolkata'"
          -c "REVOKE ALL ON DATABASE kalyan_restore_test FROM PUBLIC"
          -c "GRANT CONNECT ON DATABASE kalyan_restore_test TO kalyan_app"
      - name: Ruff lint
        working-directory: backend
        run: ruff check src
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check src
      - name: Run backend tests with coverage
        run: pytest backend/tests -v --cov=kalyan_api --cov-report=term-missing

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit backend dependencies
        run: pip install pip-audit && pip-audit -r backend/requirements.lock.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
