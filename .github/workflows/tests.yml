name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ui/redesign-modern-clinical]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Verify local image assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for asset in (
              Path("app/assets/caduceus_emblem.png"),
              Path("app/assets/kalyan_hospital_logo.jpg"),
              Path("app/assets/physiotherapy_header.jpg"),
          ):
              with Image.open(asset) as image:
                  image.verify()
              print(f"Verified {asset}")
          PY
      - name: Run automated tests
        run: pytest
